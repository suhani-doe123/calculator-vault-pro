<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CALCULATOR SCREEN -->
    <div id="calculator">
        <h1>CALCULATOR</h1>
        <div id="display">0</div>
        <div class="keys">
            <button class="op" data-action="clear">AC</button>
            <button class="op" data-action="delete">⌫</button>
            <button class="op" data-value="%">%</button>
            <button class="op" data-value="÷">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="op" data-value="×">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="op" data-value="−">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="op" data-value="+">+</button>

            <button data-value=".">.</button>
            <button data-value="0">0</button>
            <button class="op" data-action="sqrt">√</button>
            <button class="equal" data-action="equal">=</button>
        </div>
    </div>

    <!-- PIN UNLOCK PAGE -->
    <div id="pinPage" class="hidden">
        <div class="pinBox">
            <div class="lock">🔐</div>
            <h2 id="pinSubHeading">Enter PIN</h2>
            <div id="dots">○ ○ ○ ○</div>
            
            <div class="pinKeys">
                <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
                <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
                <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
                <button data-pin="delete">⌫</button><button data-pin="0">0</button><button data-pin="enter">✓</button>
            </div>
            <div id="pinError"></div>
            <button id="forgotPinBtn" class="forgot-link">Forgot PIN?</button>
        </div>
    </div>

    <!-- VAULT GALLERY PAGE -->
    <div id="vaultPage" class="hidden">
        <div class="vault">
            <header>
                <div>
                    <h2>🔐 My Vault</h2>
                </div>
                <div>
                    <button id="changePinBtn">🔑 PIN</button>
                    <button id="lockBtn">🔒 Lock</button>
                </div>
            </header>

            <div class="card">
                <div class="storageHeader">
                    <span>Storage</span>
                    <span id="percent">0%</span>
                </div>
                <div class="progress">
                    <div id="progressBar"></div>
                </div>
                <div class="storageNumbers">
                    <span id="used">Used: 0 MB</span>
                    <span id="available">Available: 1.00 GB</span>
                </div>
            </div>

            <div class="premiumCard">
                <div>
                    <b>Upgrade Storage</b>
                    <small>10 GB Premium Space ($15/mo)</small>
                </div>
                <button id="upgradeBtn">⭐ Upgrade</button>
            </div>

            <div class="uploadArea">
                <label for="photoInput">🖼️ Photos</label>
                <input type="file" id="photoInput" accept="image/*" multiple>
                
                <label for="videoInput">📹 Videos</label>
                <input type="file" id="videoInput" accept="video/*" multiple>
            </div>

            <div class="counts">
                <span id="photoCount">📷 0 Photos</span>
                <span id="videoCount">🎥 0 Videos</span>
            </div>

            <!-- FILTER TABS (ALL / PHOTOS / VIDEOS) -->
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">All</button>
                <button class="tab-btn" data-filter="photo">Photos</button>
                <button class="tab-btn" data-filter="video">Videos</button>
            </div>

            <div id="gallery"></div>
        </div>
    </div>

    <!-- UPGRADE MODAL -->
    <div id="upgradeModal" class="modal hidden">
        <div class="modalBox">
            <button id="closeModal">✕</button>
            <div class="star">⭐</div>
            <h2>Go Premium</h2>
            <div class="price">$15 USD <small>/mo</small></div>
            <p>Get up to 10 GB Storage with cloud sync feature.</p>
            <button id="subscribeBtn">Subscribe Now</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
